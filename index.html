<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pending PO Dashboard — The Bakers Dozen SCM</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#ffffff; --page:#f4f6fa; --sidebar:#0f2a4a; --sidebar-2:#16375e;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781; --grid:#e1e0d9; --baseline:#c3c2b7;
  --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-text:#006300;
  --seq-250:#86b6ef; --seq-400:#3987e5; --seq-450:#2a78d6; --seq-550:#1c5cab; --seq-650:#104281;
  --accent:#2a78d6; --accent-soft:#e8f1fc;
  --shadow:0 1px 2px rgba(15,42,74,.06),0 4px 12px rgba(15,42,74,.06);
  --radius:12px;
}
[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1e2530; --page:#151a22; --sidebar:#10151d; --sidebar-2:#1a2230;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --baseline:#383835;
  --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good-text:#0ca30c;
  --accent:#3987e5; --accent-soft:#1c2c42;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--ink);font-size:13.5px;display:flex;overflow:hidden}
/* ---------- sidebar ---------- */
.sidebar{width:224px;min-width:224px;background:var(--sidebar);color:#dbe6f3;display:flex;flex-direction:column;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3987e5,#1c5cab);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px}
.brand b{font-size:14px;color:#fff;display:block;line-height:1.15}
.brand span{font-size:11px;color:#9db4cf}
.nav{padding:10px 8px;flex:1;overflow-y:auto}
.nav .sect{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7e95b3;padding:12px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#c9d7e8;text-decoration:none;font-size:13px;margin-bottom:2px;cursor:pointer}
.nav a svg{width:16px;height:16px;flex:none;opacity:.85}
.nav a:hover{background:var(--sidebar-2)}
.nav a.active{background:var(--accent);color:#fff;font-weight:600}
.nav a .pill{margin-left:auto;background:rgba(255,255,255,.15);border-radius:99px;font-size:10.5px;padding:1px 7px;font-weight:600}
.sidenote{margin:10px;padding:10px;background:rgba(255,255,255,.06);border-radius:9px;font-size:11px;color:#9db4cf;line-height:1.45}
/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
.topbar{height:56px;background:var(--surface-1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;flex:none}
.topbar h1{font-size:15.5px;font-weight:650}
.topbar .crumb{color:var(--muted);font-size:12px}
.datastamp{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap;padding:4px 9px;border:1px solid var(--border);border-radius:999px}
.datastamp .dot{width:6px;height:6px;border-radius:50%;background:var(--ok,#28a745);flex:none}
.datastamp.stale{color:var(--warn,#b06a00);border-color:var(--warn,#b06a00)}
.datastamp.stale .dot{background:var(--warn,#b06a00)}
#refreshbtn.spinning svg{animation:spin .8s linear infinite}
.ms{position:relative;display:inline-block}
.ms-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--border);
  border-radius:8px;background:var(--surface-1);color:var(--ink);font-size:12.5px;cursor:pointer;white-space:nowrap;max-width:210px}
.ms-btn:hover{border-color:var(--accent)}
.ms-btn.on{border-color:var(--accent);color:var(--accent)}
.ms-btn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-btn .car{opacity:.55;font-size:10px;flex:none}
.ms-pop{position:absolute;z-index:60;top:36px;left:0;min-width:230px;max-width:320px;
  background:var(--surface-1);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;display:none}
.ms-pop.open{display:block}
.ms-pop input.ms-search{width:100%;height:30px;margin-bottom:6px;font-size:12.5px;
  border:1px solid var(--border);border-radius:7px;background:var(--surface-2);color:var(--ink);padding:0 8px}
.ms-list{max-height:240px;overflow:auto}
.ms-row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-size:12.5px;cursor:pointer}
.ms-row:hover{background:var(--surface-2)}
.ms-row input{flex:none;cursor:pointer}
.ms-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-foot{display:flex;gap:10px;padding:7px 6px 2px;border-top:1px solid var(--border);margin-top:6px;font-size:12px}
.ms-foot a{color:var(--accent);cursor:pointer}
.ms-empty{padding:10px 6px;color:var(--muted);font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.gsearch{margin-left:auto;position:relative}
.gsearch input{width:280px;padding:7px 12px 7px 32px;border:1px solid var(--border);border-radius:8px;background:var(--page);color:var(--ink);font-size:13px;outline:none}
.gsearch input:focus{border-color:var(--accent)}
.gsearch svg{position:absolute;left:9px;top:8px;width:15px;height:15px;color:var(--muted)}
.gresults{position:absolute;top:38px;right:0;width:360px;max-height:320px;overflow:auto;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);z-index:60;display:none}
.gresults .hit{padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12.5px}
.gresults .hit:hover{background:var(--accent-soft)}
.iconbtn{position:relative;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface-1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:var(--page)}
.iconbtn .badge{position:absolute;top:-5px;right:-5px;background:var(--crit);color:#fff;font-size:9.5px;font-weight:700;border-radius:99px;padding:1px 5px}
.avatar{width:32px;height:32px;border-radius:99px;background:linear-gradient(135deg,#eb6834,#eda100);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.content{flex:1;overflow-y:auto;padding:18px 20px 40px}
.view{display:none}.view.active{display:block}
/* ---------- cards & layout ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);cursor:default}
.kpi .lbl{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .lbl .dot{width:8px;height:8px;border-radius:99px;flex:none}
.kpi .val{font-size:26px;font-weight:680;margin-top:4px;letter-spacing:-.01em}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:3px}
.kpi.clickable{cursor:pointer}.kpi.clickable:hover{border-color:var(--accent)}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:1fr 1fr}.g32{grid-template-columns:3fr 2fr}.g23{grid-template-columns:2fr 3fr}
@media(max-width:1100px){.g2,.g32,.g23{grid-template-columns:1fr}}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.card h3{font-size:13px;font-weight:650;margin-bottom:2px}
.card .sub{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.card .hd{display:flex;align-items:flex-start;gap:8px}
.card .hd .sp{margin-left:auto;display:flex;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--ink-2);margin:6px 0 2px}
.legend .k{display:flex;align-items:center;gap:5px}
.legend .sw{width:10px;height:10px;border-radius:3px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--grid);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
td{padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
tr:hover td{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px}
.tag.blue{background:var(--accent-soft);color:var(--accent)}
.tag.amber{background:rgba(250,178,25,.15);color:#8a6100}
[data-theme="dark"] .tag.amber{color:#fab219}
.tag.red{background:rgba(208,59,59,.12);color:var(--crit)}
.tag.green{background:rgba(12,163,12,.12);color:var(--good-text)}
.tag.gray{background:var(--page);color:var(--ink-2)}
/* toolbar / filters */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .spacer{margin-left:auto}
select,.btn,input[type=text],input[type=date]{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-1);color:var(--ink);font-size:12.5px;outline:none}
select:focus,input:focus{border-color:var(--accent)}
.btn{cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--page)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center}
.chip b{cursor:pointer}
/* alert list */
.alerts .al{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--grid);font-size:12.5px;align-items:flex-start}
.alerts .al:last-child{border:none}
.al .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.al .ic.c{background:rgba(208,59,59,.12);color:var(--crit)}
.al .ic.w{background:rgba(250,178,25,.15);color:#8a6100}
[data-theme="dark"] .al .ic.w{color:#fab219}
.al .ic.i{background:var(--accent-soft);color:var(--accent)}
.al small{color:var(--muted);display:block;margin-top:1px}
/* activity */
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--grid)}
.tl .ev{position:relative;padding:7px 0 7px 8px;font-size:12.5px}
.tl .ev::before{content:"";position:absolute;left:-17px;top:12px;width:8px;height:8px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 2px var(--surface-1)}
.tl .ev small{color:var(--muted);display:block}
/* charts */
.chartbox{position:relative}
svg text{font-family:inherit}
.tip{position:fixed;z-index:100;background:var(--surface-1);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:9px;padding:8px 11px;font-size:12px;pointer-events:none;display:none;max-width:260px}
.tip b{display:block;margin-bottom:3px}
.tip .r{display:flex;gap:8px;justify-content:space-between}
.tip .r span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
/* meter */
.meter{height:8px;border-radius:99px;background:var(--seq-250);overflow:hidden;position:relative}
[data-theme="dark"] .meter{background:#1c2c42}
.meter i{display:block;height:100%;border-radius:99px}
/* detail page */
.dethead{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.dethead .big{font-size:20px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv dt{color:var(--muted)}.kv dd{font-weight:550}
.pcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:14px}
/* misc */
.note{background:var(--accent-soft);border:1px solid var(--border);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--ink-2);margin-bottom:14px;line-height:1.5}
.note b{color:var(--ink)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--ink-2)}
.pager button{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface-1);cursor:pointer;color:var(--ink)}
.pager button.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.dropdown{position:relative}
.dd-menu{position:absolute;right:0;top:38px;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:8px;z-index:50;display:none;min-width:190px;max-height:300px;overflow:auto}
.dd-menu label{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:5px 6px;border-radius:6px;cursor:pointer}
.dd-menu label:hover{background:var(--accent-soft)}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.scrollx{overflow-x:auto}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--baseline);border-radius:99px;border:2px solid var(--page)}
@media(max-width:860px){.sidebar{display:none}.gsearch input{width:150px}}
</style>
</head>

<script type="module">
/* ======================= LIVE DATA (Google Sheets) =======================
   The static data blob that used to live here has been replaced by a fetch
   to /api/po-data. Everything below this block is unchanged and still works,
   because loadData() returns an object with exactly the same shape --
   including a `pivot` that is now derived from the PO lines rather than
   pasted in, so the KPI cards and the PO table can never disagree.
   ======================================================================== */
const DATA_ENDPOINT = '/api/po-data';
const PLATFORM_ORDER = ['Amazon','Big Basket','Blinkit','FirstClub','FK','Swiggy','Milk Basket','Zepto'];

const DATA = await (async function loadData(){

  const screen = document.createElement('div');
  screen.style.cssText = 'position:fixed;inset:0;z-index:999;display:flex;align-items:center;'
    + 'justify-content:center;text-align:center;padding:24px;background:var(--page);color:var(--ink);'
    + 'font:14px system-ui,-apple-system,"Segoe UI",sans-serif';
  screen.innerHTML = '<div><b>Loading purchase orders</b><br>'
    + '<span style="color:var(--muted);font-size:12.5px" id="bootstatus">Reading the source sheet.</span></div>';
  document.body.append(screen);

  // A dead screen tells you nothing. Count up, so a slow read is visibly
  // different from a hung one.
  const t0 = Date.now();
  const statusEl = () => document.getElementById('bootstatus');
  const tick = setInterval(() => {
    const secs = Math.round((Date.now() - t0) / 1000);
    const el = statusEl();
    if (el && secs >= 3) {
      el.textContent = secs < 15
        ? 'Reading the source sheet... ' + secs + 's'
        : 'Still reading... ' + secs + 's. Large sheets can take a while.';
    }
  }, 1000);

  const fail = (title, detail, hint) => {
    screen.innerHTML = '<div style="max-width:560px;line-height:1.5">'
      + '<b style="font-size:15px">' + title + '</b>'
      + '<div style="color:var(--ink-2);font-size:12.5px;margin-top:8px">' + detail + '</div>'
      + '<div style="color:var(--muted);font-size:12px;margin-top:14px">' + hint + '</div>'
      + '<button id="retrybtn" style="margin-top:16px;padding:7px 14px;border-radius:8px;'
      + 'border:1px solid var(--border);background:var(--surface-1);color:var(--ink);'
      + 'font-size:12.5px;cursor:pointer">Try again</button></div>';
    const rb = document.getElementById('retrybtn');
    if (rb) rb.addEventListener('click', () => { location.search = '?refresh=1'; });
  };

  let d;
  // A refresh click reloads the page with ?refresh=1, which we turn into
  // ?fresh=1 on the API so the CDN cache is bypassed. Reloading rather than
  // re-deriving in place means every view is rebuilt from the new data --
  // no chance of a stale chart sitting next to a fresh table.
  //
  // Declared OUT here on purpose: it is read again further down, after the
  // try block, to strip the query param from the URL. Declaring it with const
  // inside the try made it block-scoped and the later read threw
  // "wantsFresh is not defined".
  const wantsFresh = new URLSearchParams(location.search).get('refresh') === '1';
  try {

    // Without a timeout a hung function leaves the page loading forever with
    // no explanation -- which is exactly the failure this replaced.
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 30000);
    let res;
    try {
      res = await fetch(DATA_ENDPOINT + (wantsFresh ? '?fresh=1' : ''), { signal: ctrl.signal });
    } finally {
      clearTimeout(timer);
    }

    const raw = await res.text();
    try {
      d = JSON.parse(raw);
    } catch (parseErr) {
      // A gateway timeout or crash returns HTML, not JSON. Say so plainly
      // rather than surfacing "Unexpected token <".
      throw new Error('The server returned ' + res.status + ' with a non-JSON response ('
        + raw.length + ' bytes). This usually means the function timed out or crashed. '
        + 'First 200 characters: ' + raw.slice(0, 200));
    }
    if (!res.ok) throw new Error(d.detail || d.error || ('Request failed (' + res.status + ')'));
  } catch (err) {
    clearInterval(tick);
    console.error('[dashboard] load failed:', err);
    const aborted = err && err.name === 'AbortError';
    fail('The dashboard could not read the sheet',
         aborted
           ? 'The request took longer than 30 seconds and was cancelled. The sheet may be very large, '
             + 'or the function may be timing out.'
           : String(err && err.message ? err.message : err),
         'Open <code>/api/po-data?debug=1</code> in a new tab to see what the sheet is returning. '
         + 'Full details are in the browser console (F12).');
    throw err;
  }

  if (!d.poLines || !d.poLines.length) {
    fail('No purchase orders found',
         'The sheet was read successfully but the PO Lines tab returned no rows.',
         'Check that the tab has a header row in row 1 and data below it.');
    throw new Error('no PO lines');
  }

  /* ---- from here on, any throw must still surface -------------------------
     Previously this section sat outside the try/catch, so a single bad row
     could leave the page stuck on "Loading purchase orders" forever with
     nothing reported anywhere. ---------------------------------------------- */
  try {

  /* ---- rebuild the pivot from the PO lines (PO counts, not line counts) ---- */
  // The sheet now carries its own Platform column, so that is the source of
  // truth. The channel-prefix guess is kept only as a fallback for rows where
  // the column is blank -- a blank there should not silently become 'Other'
  // when the channel name clearly says Blinkit.
  const platFallback = ch => {
    ch = (ch || '').toUpperCase();
    if (ch.startsWith('BLINKIT')) return 'Blinkit';
    if (ch.startsWith('SWIGGY')) return 'Swiggy';
    if (ch.startsWith('FLIPKART')) return 'FK';
    if (ch.startsWith('AMAZON')) return 'Amazon';
    if (ch.startsWith('ZEPTO')) return 'Zepto';
    if (ch.startsWith('MILK')) return 'Milk Basket';
    if (ch.startsWith('BB') || ch.startsWith('BIG')) return 'Big Basket';
    return 'Other';
  };
  const platOfLocal = l => (l.platform || '').trim() || platFallback(l.channel);

  const orders = new Map();
  d.poLines.forEach(l => {
    if (!orders.has(l.orderId)) {
      orders.set(l.orderId, { wh: l.wh || 'Unmapped', orderDate: l.orderDate,
        apptDate: l.apptDate, platform: platOfLocal(l), value: 0 });
    }
    orders.get(l.orderId).value += (+l.value || 0);
  });
  const O = [...orders.values()];

  // PLATFORM_ORDER only fixes the display order of names we already know. Any
  // new platform the sheet introduces is appended rather than dropped, and
  // names that never appear are trimmed so empty series don't clutter charts.
  const seen = [...new Set(O.map(o => o.platform))].filter(Boolean);
  const platforms = PLATFORM_ORDER.filter(p => seen.includes(p))
    .concat(seen.filter(p => !PLATFORM_ORDER.includes(p)).sort());

  const blank = () => { const o = { total: 0 }; platforms.forEach(p => o[p] = 0); return o; };
  const make = keyOf => {
    const counts = {}, values = {};
    O.forEach(o => {
      const k = keyOf(o); if (!k) return;
      if (!counts[k]) { counts[k] = blank(); values[k] = blank(); }
      const p = o.platform;
      if (counts[k][p] === undefined) { counts[k][p] = 0; values[k][p] = 0; }
      counts[k][p]++; counts[k].total++;
      values[k][p] += o.value; values[k].total += o.value;
    });
    const gc = blank(), gv = blank();
    Object.keys(counts).forEach(k => Object.keys(counts[k]).forEach(p => {
      gc[p] = (gc[p] || 0) + counts[k][p];
      gv[p] = (gv[p] || 0) + values[k][p];
    }));
    counts['Grand Total'] = gc; values['Grand Total'] = gv;
    return { platforms, counts, values };
  };

  d.pivot = {
    wh:          make(o => o.wh),
    poDate:      make(o => o.orderDate),
    appointment: make(o => o.apptDate || 'Appointment Pending')
  };

  /* ---- data age indicator -------------------------------------------------
     This deliberately does NOT write into #crumb: goView() rewrites that on
     every navigation, so the timestamp would vanish the moment you clicked
     anything. It gets its own element in the topbar instead. ---------------- */
  if (wantsFresh) history.replaceState(null, '', location.pathname);

  const stampEl = document.getElementById('datastamp');
  const ageEl = document.getElementById('dataage');
  const fetchedAt = d.fetchedAt ? new Date(d.fetchedAt) : null;

  const paintAge = () => {
    if (!ageEl || !fetchedAt) return;
    const mins = Math.floor((Date.now() - fetchedAt.getTime()) / 60000);
    ageEl.textContent = mins < 1 ? 'just now'
      : mins < 60 ? mins + ' min ago'
      : Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm ago';
    if (stampEl) {
      stampEl.classList.toggle('stale', mins >= 20);
      stampEl.title = 'Sheet read at ' + fetchedAt.toLocaleString('en-IN')
        + (mins >= 20 ? ' - click refresh for the latest' : '');
    }
  };
  paintAge();
  setInterval(paintAge, 30000);

  const rbtn = document.getElementById('refreshbtn');
  if (rbtn) {
    rbtn.addEventListener('click', () => {
      rbtn.classList.add('spinning');
      rbtn.disabled = true;
      if (ageEl) ageEl.textContent = 'refreshing';
      location.search = '?refresh=1';
    });
  }

  clearInterval(tick);
  screen.remove();
  return d;

  } catch (err) {
    clearInterval(tick);
    console.error('[dashboard] failed while processing sheet data:', err);
    fail('The sheet was read, but the data could not be processed',
         String(err && err.message ? err.message : err),
         'The rows arrived but something in them broke the calculation. '
         + 'Open the browser console (F12) for the full stack trace, and check '
         + '<code>/api/po-data?debug=1</code> for the column names being returned.');
    throw err;
  }
})();

'use strict';
// Ageing is measured from today at midnight. This used to be frozen at
// 11 Aug 2026, which silently understated every PO's age once the data
// went live -- and by a day more with each day that passed.
const SNAP = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const fmtDay = d => d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
const TODAY_LABEL = fmtDay(SNAP);
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- formatting ---------- */
const fmtIN = n => { // Indian digit grouping
  n = Math.round(n); const s = String(Math.abs(n)); let r;
  if (s.length <= 3) r = s;
  else { const last3 = s.slice(-3); r = s.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3; }
  return (n<0?'-':'') + r;
};
const fmtC = n => { // compact ₹ (lakh / crore)
  const a = Math.abs(n);
  if (a >= 1e7) return '₹' + (n/1e7).toFixed(2).replace(/\.00$/,'') + ' Cr';
  if (a >= 1e5) return '₹' + (n/1e5).toFixed(2).replace(/\.00$/,'') + ' L';
  if (a >= 1e3) return '₹' + (n/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
  return '₹' + fmtIN(n);
};
const fmtV = n => '₹' + fmtIN(n);
const pDMY = s => { const m = String(s).match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/); return m ? new Date(+m[3], +m[2]-1, +m[1]) : null; };
const pMDY = s => { const m = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? new Date(+m[3], +m[1]-1, +m[2]) : null; };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD = d => d ? `${d.getDate()} ${MON[d.getMonth()]}` : '—';
const fmtDF = d => d ? `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}` : '—';
const days = d => d ? Math.round((SNAP - d)/86400000) : null;

/* ---------- palette ---------- */
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const PLATS = DATA.pivot.wh.platforms; // fixed entity order, never filtered
const PCOLOR = {}; PLATS.forEach((p,i)=> PCOLOR[p] = `var(--s${i+1})`);

/* ---------- derived figures --------------------------------------------
   These used to be `const`, computed once from every order. They are now
   rebuilt by recompute() from whatever set of orders is currently in scope,
   so the Dashboard responds to the filter bar.

   `let`, not `const`, precisely because they are reassigned. Everything that
   reads them (renderDashboard and friends) is unchanged -- it still sees the

const TODAY_KEY = (() => { const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()}`; })();
const AGE_BUCKETS = [['0–2 days',0,2],['3–5 days',3,5],['6–8 days',6,8],['9+ days',9,99]];

let P, GT_N, GT_V, whRows, dateRows, apRows;
let AP_PEND_N, AP_PEND_V, TODAY_N, TODAY_V;
let ageAgg, OVERDUE, CRIT;
let SCOPE_ORDERS = null;   // null = the full universe

/* Build the three pivots from an arbitrary list of orders. Counts are distinct
   POs, values are summed PO values -- identical logic to the initial load, so
   a filtered view and the full view are computed the same way. */
function pivotFrom(orders){
  const blank = () => { const o = {total:0}; PLATS.forEach(p=>o[p]=0); return o; };
  const make = keyOf => {
    const counts = {}, values = {};
    orders.forEach(o => {
      const k = keyOf(o); if (!k) return;
      if (!counts[k]) { counts[k] = blank(); values[k] = blank(); }
      const pl = o.platform;
      if (counts[k][pl] === undefined) { counts[k][pl] = 0; values[k][pl] = 0; }
      counts[k][pl]++; counts[k].total++;
      values[k][pl] += o.value; values[k].total += o.value;
    });
    const gc = blank(), gv = blank();
    Object.keys(counts).forEach(k => Object.keys(counts[k]).forEach(pl => {
      gc[pl] = (gc[pl]||0) + counts[k][pl];
      gv[pl] = (gv[pl]||0) + values[k][pl];
    }));
    counts['Grand Total'] = gc; values['Grand Total'] = gv;
    return { platforms: PLATS, counts, values };
  };
  return {
    wh:          make(o => o.wh || 'Unmapped'),
    poDate:      make(o => o.orderDate),
    appointment: make(o => o.apptDate || 'Appointment Pending')
  };
}

function recompute(orders){
  SCOPE_ORDERS = orders || null;
  // Both paths go through pivotFrom, so the unfiltered view and a filtered one
  // are computed by identical code. Falling back to a prebuilt DATA.pivot here
  // would mean two code paths that could drift -- and would crash if it were
  // ever absent.
  P = pivotFrom(orders || ORDERS);

  GT_N = P.wh.counts['Grand Total'].total;
  GT_V = P.wh.values['Grand Total'].total;
  whRows   = Object.keys(P.wh.counts).filter(k=>k!=='Grand Total');
  dateRows = Object.keys(P.poDate.counts).filter(k=>k!=='Grand Total');
  apRows   = Object.keys(P.appointment.counts).filter(k=>k!=='Grand Total');

  // Optional chaining matters here: filter to a single scheduled warehouse and
  // the 'Appointment Pending' row simply will not exist.
  AP_PEND_N = P.appointment.counts['Appointment Pending']?.total || 0;
  AP_PEND_V = P.appointment.values['Appointment Pending']?.total || 0;
  TODAY_N   = P.appointment.counts[TODAY_KEY]?.total || 0;
  TODAY_V   = P.appointment.values[TODAY_KEY]?.total || 0;

  ageAgg = AGE_BUCKETS.map(([lbl,lo,hi]) => {
    let n=0,v=0;
    dateRows.forEach(dr => {
      const a = days(pDMY(dr));
      if (a!==null && a>=lo && a<=hi){ n+=P.poDate.counts[dr].total; v+=P.poDate.values[dr].total; }
    });
    return {label:lbl, n, v};
  });
  OVERDUE = ageAgg.filter(b=>b.label!=='0–2 days'&&b.label!=='3–5 days')
                  .reduce((s,b)=>({n:s.n+b.n,v:s.v+b.v}),{n:0,v:0});
  CRIT = ageAgg[3];
}

/* ---------- line-level detail (Uni Commerce extract) ---------- */

/* ---------- chart helpers (SVG) ---------- */
function niceMax(m){ if(m<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(m))); for(const f of [1,2,2.5,5,10]){ if(m <= f*p) return f*p; } return 10*p; }

    g += `<path class="col" data-i="${i}" d="M${labelW},${y} L${labelW+bw-r},${y} Q${labelW+bw},${y} ${labelW+bw},${y+4} L${labelW+bw},${y+12} Q${labelW+bw},${y+16} ${labelW+bw-r},${y+16} L${labelW},${y+16} Z" fill="${col}"/>`;

  el.addEventListener('mousemove', ev=>{ const t=ev.target.closest('.col'); if(!t){hideTip();return;}

  el.addEventListener('mouseleave', hideTip);
  return el;
}

};

/* ---------- shared filter bar --------------------------------------------
   One markup builder and one wiring function, used by the Dashboard and the
   Pending POs view. Two copies of this would drift apart within a week.
   -------------------------------------------------------------------------- */
const FILTER_DEFS = [
  ['wh',   'Warehouse',  'All warehouses'],
  ['plat', 'Platform',   'All platforms'],
  ['ch',   'Channel',    'All channels'],
  ['cat',  'Category',   'All categories'],
  ['apd',  'Appt date',  'Any appt date'],
  ['ap',   'Appt status','Any appt status'],
];

/* Button label: the selection itself when it is short enough to read, a count
   when it is not. "Blinkit" beats "Platform (1)"; "Platform (7)" beats seven
   names crushed into an ellipsis. */
function msLabel(key, placeholder){
  const v = FS[key];
  if (!v.length) return placeholder;
  if (v.length === 1) return v[0];
  if (v.length === 2 && v.join(', ').length <= 24) return v.join(', ');
  return `${FILTER_DEFS.find(d=>d[0]===key)[1]} (${v.length})`;
}

function filterBarHTML(){
  // Every list is narrowed by the OTHER active filters, so choosing
  // Platform = Blinkit leaves only Blinkit's channels in the Channel dropdown.
  const uid = 'oid'+Math.random().toString(36).slice(2,8);   // datalist ids must be unique
  const oids = optionsFor('oid');
  const ms = FILTER_DEFS.map(([k,label,ph]) => {
    const avail = optionsFor(k);
    const total = k === 'cat'
      ? new Set(DATA.poLines.map(l=>l.category).filter(Boolean)).size
      : new Set(ORDERS.map(o => k==='wh'?o.wh : k==='plat'?o.platform : k==='ch'?o.channel
                : k==='apd'?(o.apptDate||'Appointment Pending') : o.apStatus).filter(Boolean)).size;
    const narrowed = avail.length < total ? ` (${avail.length} of ${total})` : '';
    return `<div class="ms" data-ms="${k}" data-ph="${esc(ph)}">
      <button type="button" class="ms-btn ${FS[k].length?'on':''}" title="${esc(label)}${esc(narrowed)}">
        <span class="lbl">${esc(msLabel(k, ph))}</span><span class="car">▾</span>
      </button>
      <div class="ms-pop"></div>
    </div>`;
  }).join('');
  return `
  <div class="toolbar">
    <input type="text" data-f="q" placeholder="Search PO / item / channel…" style="width:180px" value="${esc(FS.q)}">
    <input type="text" data-f="oid" list="${uid}" placeholder="Order ID" style="width:125px" value="${esc(FS.oid)}" title="Order ID — type to match part of it">
    <datalist id="${uid}">${oids.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>
    ${ms}
    <input type="date" data-f="from" value="${FS.from}" title="Order date from">
    <input type="date" data-f="to"   value="${FS.to}"   title="Order date to">
    <button class="btn ghost" data-f-clear>Clear<span data-f-count></span></button>
  </div>
  <div class="scopebanner"></div>`;
}

/* Panel contents are built on open, not on render -- so the list always
   reflects the filters as they stand right now, including ones changed while
   this panel was shut. */
function msPanelHTML(key, query){
  const avail = optionsFor(key);
  const sel = FS[key];
  // Selected values that the other filters have made unreachable still show,
  // otherwise there would be no way to untick them.
  const all = [...new Set([...sel, ...avail])];
  const q = (query||'').toLowerCase();
  const shown = q ? all.filter(v => v.toLowerCase().includes(q)) : all;
  const searchable = all.length > 8;
  return `
    ${searchable ? `<input class="ms-search" placeholder="Search ${esc(key==='ch'?'channels':'options')}…" value="${esc(query||'')}">` : ''}
    <div class="ms-list">
      ${shown.length ? shown.map(v => `
        <label class="ms-row">
          <input type="checkbox" value="${esc(v)}" ${sel.includes(v)?'checked':''} ${avail.includes(v)?'':'data-stale="1"'}>
          <span${avail.includes(v)?'':' style="opacity:.5"'}>${esc(v)}</span>
        </label>`).join('') : '<div class="ms-empty">Nothing matches</div>'}
    </div>
    <div class="ms-foot"><a data-ms-all>Select all</a><a data-ms-none>Clear</a></div>`;
}

function wireMultiSelect(root, onChange){
  root.querySelectorAll('.ms').forEach(ms => {
    const key = ms.dataset.ms;
    const btn = ms.querySelector('.ms-btn');
    const pop = ms.querySelector('.ms-pop');

    const paint = (query) => {
      pop.innerHTML = msPanelHTML(key, query);
      const search = pop.querySelector('.ms-search');
      if (search){
        search.addEventListener('input', e => {
          const val = e.target.value;
          paint(val);
          const box = pop.querySelector('.ms-search');
          if (box){ box.focus(); box.setSelectionRange(val.length, val.length); }
        });
      }
      pop.querySelectorAll('.ms-list input[type=checkbox]').forEach(cb => {
        cb.addEventListener('change', () => {
          const v = cb.value;
          FS[key] = cb.checked ? [...FS[key], v] : FS[key].filter(x => x !== v);
          onChange(key);
        });
      });
      pop.querySelector('[data-ms-all]')?.addEventListener('click', () => {
        FS[key] = [...new Set([...FS[key], ...optionsFor(key)])]; onChange(key);
      });
      pop.querySelector('[data-ms-none]')?.addEventListener('click', () => {
        FS[key] = []; onChange(key);
      });
    };

    btn.addEventListener('click', e => {
      e.stopPropagation();
      const wasOpen = pop.classList.contains('open');
      document.querySelectorAll('.ms-pop.open').forEach(x => x.classList.remove('open'));
      if (!wasOpen){ paint(''); pop.classList.add('open'); pop.querySelector('.ms-search')?.focus(); }
    });
    // Clicks inside the panel must not close it -- ticking three boxes in a row
    // is the whole point of multi-select.
    pop.addEventListener('click', e => e.stopPropagation());
  });
}

document.addEventListener('click', () => {
  document.querySelectorAll('.ms-pop.open').forEach(x => x.classList.remove('open'));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.ms-pop.open').forEach(x => x.classList.remove('open'));
});

/* Wire one bar, scoped to its own view. */
function wireFilterBar(root, onChange){
  if (!root) return;
  root.querySelectorAll('[data-f]').forEach(el => {
    const k = el.dataset.f;
    el.addEventListener(TEXT_FILTERS.has(k) ? 'input' : 'change', e => {
      FS[k] = e.target.value; onChange(k);
    });
  });
  wireMultiSelect(root, onChange);
  const c = root.querySelector('[data-f-clear]');
  if (c) c.addEventListener('click', () => { clearFS(); onChange(); });
}

/* Push FS back onto every bar, so the two views never disagree. */
function syncFilterBars(){
  document.querySelectorAll('[data-f]').forEach(el => { el.value = FS[el.dataset.f] ?? ''; });
  document.querySelectorAll('.ms').forEach(ms => {
    const k = ms.dataset.ms;
    const btn = ms.querySelector('.ms-btn');
    btn.querySelector('.lbl').textContent = msLabel(k, ms.dataset.ph);
    btn.classList.toggle('on', FS[k].length > 0);
  });
  const n = Object.entries(FS).filter(([k,v]) => isMulti(k) ? v.length : v !== '').length;
  document.querySelectorAll('[data-f-count]').forEach(el => { el.textContent = n ? ` (${n})` : ''; });
  document.querySelectorAll('[data-f-clear]').forEach(el => el.classList.toggle('primary', n > 0));
}

/* ============ PENDING PO MANAGEMENT ============ */
const COLS = [
  ['orderId','PO number',1],['wh','Warehouse',1],['platform','Platform',1],['channel','Facility / channel',0],
  ['orderDate','PO date',1],['apptDate','Appointment',1],['apStatus','Appt status',1],['age','Age (d)',1],
  ['lines','Lines',1],['qty','Qty',1],['value','PO value',1],['custRef','Cust ref',0],['remark','Remark',1]
];
// oid  = Order ID (substring, case-insensitive)
// ch   = raw Channel value from the sheet, e.g. BLINKIT_MUM (distinct from
//        plat, which is the rolled-up platform: Blinkit, Swiggy, ...)
// apd  = a specific appointment date, or the Appointment Pending bucket
/* Six categorical filters hold ARRAYS (empty = no restriction). q, oid, from
   and to stay scalar. MULTI is the single source of truth for which is which;
   every helper below branches on it rather than guessing from the value. */
const MULTI = ['wh','plat','ch','cat','apd','ap'];
const TEXT_FILTERS = new Set(['q','oid']);
const isMulti = k => MULTI.includes(k);
const blankFS = () => ({q:'', oid:'', wh:[], plat:[], ch:[], cat:[], apd:[], ap:[], from:'', to:''});
const FS = blankFS();
const fsActive = () => Object.entries(FS).some(([k,v]) => isMulti(k) ? v.length : v !== '');
const clearFS = () => Object.assign(FS, blankFS());
/* {...FS} copies array REFERENCES, so a saved view would keep changing as the
   live filters changed. Copy the arrays themselves. */
const cloneFS = f => { const o = {...f}; MULTI.forEach(k => o[k] = [...(f[k]||[])]); return o; };
let SORT = {k:'value', dir:-1}, PAGE = 1, PER = 15, SEL = new Set();
let visCols = new Set(COLS.filter(c=>c[2]).map(c=>c[0]));
let savedViews = [{name:'High value first', fs:blankFS(), sort:{k:'value',dir:-1}},
                  {name:'Awaiting appointment', fs:{...blankFS(), ap:['Appointment Pending']}, sort:{k:'age',dir:-1}}];

/* One predicate, taking the filter set as an argument. The cascading option
   lists need to evaluate "everything except this one filter", and a second
   copy of the matching logic would drift from this one within a week. */
function matchOrder(o, F){
  if (F.q){ const q=F.q.toLowerCase(); if(!(o.orderId.toLowerCase().includes(q)||o.channel.toLowerCase().includes(q)||o.lines.some(l=>l.itemName.toLowerCase().includes(q)||l.item.toLowerCase().includes(q)))) return false; }
  if (F.oid && !o.orderId.toLowerCase().includes(F.oid.toLowerCase())) return false;
  // An empty array means "no restriction". Selecting several values is an OR
  // within that filter, and an AND across filters -- which is what people
  // expect from faceted filtering.
  if (F.wh.length   && !F.wh.includes(o.wh)) return false;
  if (F.plat.length && !F.plat.includes(o.platform)) return false;
  if (F.ch.length   && !F.ch.includes(o.channel)) return false;
  // 'Appointment Pending' must match POs with no date at all -- not POs whose
  // date happens to equal that string.
  if (F.apd.length){ const key = o.apptDate || 'Appointment Pending'; if (!F.apd.includes(key)) return false; }
  if (F.ap.length   && !F.ap.includes(o.apStatus)) return false;
  // A PO can span categories, so match if ANY line is in ANY chosen category.
  if (F.cat.length  && !o.lines.some(l=>F.cat.includes(l.category))) return false;
  if (F.from && o.oDate < new Date(F.from)) return false;
  if (F.to && o.oDate > new Date(F.to)) return false;
  return true;
}

function filteredOrders(){ return ORDERS.filter(o => matchOrder(o, FS)); }

/* Orders matching every filter EXCEPT `skip`. This is what makes the dropdowns
   cascade: the Channel list is built from orders that satisfy Platform, WH and
   the rest, but ignore whatever Channel is currently set. Without the skip, the
   selected value would be the only option its own list could ever contain. */
function ordersExcept(skip){
  const F = Object.assign({}, FS, {[skip]: isMulti(skip) ? [] : ''});
  return ORDERS.filter(o => matchOrder(o, F));
}

/* Option list for one filter, narrowed by all the others. */
function optionsFor(key){
  const src = ordersExcept(key);
  let vals;
  if (key === 'cat') vals = src.flatMap(o => o.lines.map(l => l.category));
  else if (key === 'apd') vals = src.map(o => o.apptDate || 'Appointment Pending');
  else if (key === 'ap') vals = src.map(o => o.apStatus);
  else if (key === 'oid') vals = src.map(o => o.orderId);
  else if (key === 'wh') vals = src.map(o => o.wh);
  else if (key === 'plat') vals = src.map(o => o.platform);
  else if (key === 'ch') vals = src.map(o => o.channel);
  else return [];
  const out = [...new Set(vals.filter(Boolean))];
  if (key === 'apd') {
    // chronological, with the Pending bucket pinned first
    const pend = out.includes('Appointment Pending');
    const dates = out.filter(v => v !== 'Appointment Pending')
                     .sort((a,b) => (pDMY(a)||0) - (pDMY(b)||0));
    return pend ? ['Appointment Pending', ...dates] : dates;
  }
  return out.sort();
}

/* After a change, a previously chosen value can become impossible -- pick
   Platform=Blinkit while Channel=SWIGGY_BLR is set and the result is zero rows
   with no explanation.

   `keep` is the filter the user just touched, and it is never pruned. Without
   it the outcome is arbitrary: with Platform=Blinkit and Channel=SWIGGY_BLR
   BOTH are individually impossible, so whichever the loop reaches first gets
   cleared. Setting Platform would silently clear Platform and leave the stale
   Channel -- the opposite of what was asked for. */
function pruneFilters(keep){
  const dropped = [];
  MULTI.forEach(k => {
    if (k === keep || !FS[k].length) return;
    const avail = optionsFor(k);
    // Keep the values still reachable; report the ones that are not. Dropping
    // the whole filter would throw away valid selections alongside dead ones.
    const kept = FS[k].filter(v => avail.includes(v));
    if (kept.length !== FS[k].length) {
      FS[k].filter(v => !avail.includes(v)).forEach(v => dropped.push([k, v]));
      FS[k] = kept;
    }
  });
  return dropped;
}

/* ============ REPORT VIEW ============ */
/* Three cross-tabs, all reading the same pivots the KPIs use, so a number here
   can never disagree with the Dashboard. `P` is rebuilt by recompute() on every
   filter change, which is why this view needs no filter logic of its own. */
let RPT_METRIC = 'value';   // 'value' | 'count'

const RPT_TABS = [
  ['wh',          'WH Location × Platform',      'Warehouse'],
  ['poDate',      'PO Date × Platform',          'PO date'],
  ['appointment', 'Appointment Date × Platform', 'Appointment date'],
];

/* Row order differs by dimension: warehouses alphabetically, dates
   chronologically (string sort would put 2-08 after 15-08), and the
   Appointment Pending bucket pinned to the top where it gets noticed. */
function rptRows(dim){
  const keys = Object.keys(P[dim].counts).filter(k => k !== 'Grand Total');
  if (dim === 'wh') return keys.sort();
  const pend = keys.includes('Appointment Pending') ? ['Appointment Pending'] : [];
  return pend.concat(keys.filter(k => k !== 'Appointment Pending')
                         .sort((a,b) => (pDMY(a)||0) - (pDMY(b)||0)));
}

/* Only platforms that actually appear, so a filtered view isn't padded with
   empty columns. */
function rptCols(dim){
  const gt = P[dim].counts['Grand Total'] || {};
  return PLATS.filter(pl => (gt[pl] || 0) > 0);
}

function rptCell(v){
  if (!v) return '<td class="num" style="color:var(--muted)">—</td>';
  return `<td class="num">${RPT_METRIC === 'value' ? fmtC(v) : fmtIN(v)}</td>`;
}

function rptTableHTML(dim, title, rowLabel){
  const rows = rptRows(dim), cols = rptCols(dim);
  const src = RPT_METRIC === 'value' ? P[dim].values : P[dim].counts;
  const gt = src['Grand Total'] || {};
  if (!rows.length) return `<div class="card" style="margin-bottom:14px"><h3>${esc(title)}</h3>
    <div class="sub">No rows under the current filters.</div></div>`;
  return `
  <div class="card" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div><h3>${esc(title)}</h3><div class="sub">${rows.length} ${esc(rowLabel.toLowerCase())}(s) × ${cols.length} platform(s) · ${RPT_METRIC === 'value' ? 'PO value' : 'PO count'}</div></div>
      <button class="btn ghost" data-rpt-csv="${dim}">⬇ CSV</button>
    </div>
    <div class="scrollx"><table>
      <thead><tr><th>${esc(rowLabel)}</th>${cols.map(c=>`<th class="num">${esc(c)}</th>`).join('')}<th class="num">Total</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td>${esc(r)}</td>
          ${cols.map(c => rptCell(src[r]?.[c] || 0)).join('')}
          <td class="num"><b>${RPT_METRIC === 'value' ? fmtC(src[r]?.total || 0) : fmtIN(src[r]?.total || 0)}</b></td>
        </tr>`).join('')}
      </tbody>
      <tfoot><tr>
        <th>Grand total</th>
        ${cols.map(c => `<th class="num">${RPT_METRIC === 'value' ? fmtC(gt[c] || 0) : fmtIN(gt[c] || 0)}</th>`).join('')}
        <th class="num">${RPT_METRIC === 'value' ? fmtC(gt.total || 0) : fmtIN(gt.total || 0)}</th>
      </tr></tfoot>
    </table></div>
  </div>`;
}

function rptCSV(dim){
  const rows = rptRows(dim), cols = rptCols(dim);
  const src = RPT_METRIC === 'value' ? P[dim].values : P[dim].counts;
  const gt = src['Grand Total'] || {};
  const label = RPT_TABS.find(t => t[0] === dim)[2];
  const esc2 = v => `"${String(v).replace(/"/g,'""')}"`;
  const lines = [[label, ...cols, 'Total'].map(esc2).join(',')];
  rows.forEach(r => lines.push([r, ...cols.map(c => src[r]?.[c] || 0), src[r]?.total || 0].map(esc2).join(',')));
  lines.push(['Grand total', ...cols.map(c => gt[c] || 0), gt.total || 0].map(esc2).join(','));
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `report_${dim}_x_platform_${RPT_METRIC}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

  const agg = {};
  F.forEach(r=>{ const k=r.shipTo; (agg[k] ||= {po:0,so:0,inv:0,grn:0,n:0}); const a=agg[k];
    a.po+=r.poVal; a.so+=r.soVal; a.inv+=r.invVal; a.grn+=r.grnVal; a.n++; });
  const fPO=F.reduce((s,r)=>s+r.poVal,0), fSO=F.reduce((s,r)=>s+r.soVal,0), fINV=F.reduce((s,r)=>s+r.invVal,0);
  v.innerHTML = `
  ${F.length ? `<div class="note">The <b>Dispatch vs Sales</b> tab tracks each PO line from sales order to invoice to GRN — ${fmtIN(F.length)} lines loaded. SO value above PO value reflects revised or split indents.</div>` : `<div class="note"><b>Fill-rate data is not loaded.</b> The Dispatch vs Sales tab holds roughly 87,000 rows, which is too large to send to the browser, so it is switched off in <code>api/po-data.js</code> until it is summarised on the server. Nothing below is missing data — it has not been read.</div>`}
  <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
    ${kpi('Tracked PO value', fmtC(fPO), F.length+' lines')}
    ${kpi('SO value', fmtC(fSO), 'sales orders raised')}
    ${kpi('Invoiced', fmtC(fINV), F.filter(r=>r.invNum).length+' of '+F.length+' lines', {color:'var(--serious)'})}
    ${kpi('GRN received', fmtC(F.reduce((s,r)=>s+r.grnVal,0)), 'no GRNs in this cut')}
  </div>
  <div class="card" style="margin-bottom:14px"><div class="hd"><div><h3>By ship-to location</h3><div class="sub">PO vs SO vs invoiced value</div></div></div>
    <div class="scrollx"><table><thead><tr><th>Ship-to</th><th class="num">Lines</th><th class="num">PO value</th><th class="num">SO value</th><th class="num">Invoiced</th><th class="num">Inv %</th></tr></thead>
    <tbody>${Object.entries(agg).map(([k,a])=>`<tr><td>${esc(k)}</td><td class="num">${a.n}</td><td class="num">${fmtV(a.po)}</td><td class="num">${fmtV(a.so)}</td><td class="num">${fmtV(a.inv)}</td>
      <td class="num">${a.so? (a.inv/a.so*100).toFixed(1):'0.0'}%</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><div class="hd"><div><h3>Line detail</h3><div class="sub">${F.length} rows</div></div></div>
    <div class="scrollx"><table><thead><tr><th>WH</th><th>SO date</th><th>SO number</th><th>Ship-to</th><th>Item</th><th>Category</th>
      <th class="num">PO qty</th><th class="num">SO qty</th><th class="num">INV qty</th><th class="num">SO value</th><th>Status</th></tr></thead>
    <tbody>${F.map(r=>`<tr><td>${esc(r.wh)}</td><td>${esc(r.soDate)}</td><td>${esc(r.soNum)}</td><td>${esc(r.shipTo)}</td>
      <td title="${esc(r.itemName)}">${esc(r.item)}</td><td>${esc(r.category)}</td>
      <td class="num">${fmtIN(r.poQty)}</td><td class="num">${fmtIN(r.soQty)}</td><td class="num">${fmtIN(r.invQty)}</td><td class="num">${fmtV(r.soVal)}</td>
      <td>${r.invNum?'<span class="tag green">Invoiced</span>':'<span class="tag amber">Awaiting invoice</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ============ MASTERS ============ */
let MTAB = 'items', MPAGE = 1, MQ = '';
function renderMasters(){
  const v = $('#view-masters');
  v.innerHTML = `
  <div class="toolbar">
    ${[['items','Items · Carton & MRP'],['warehouses','Warehouses'],['platforms','Platform master']].map(([k,l])=>
      `<button class="btn ${MTAB===k?'primary':''}" data-mtab="${k}">${l}</button>`).join('')}
    <span class="spacer"></span>
    <input type="text" id="m-q" placeholder="Search…" value="${esc(MQ)}" style="width:200px">
  </div>
  <div id="m-body"></div>`;
  $$('[data-mtab]').forEach(b=>b.addEventListener('click', ()=>{MTAB=b.dataset.mtab; MPAGE=1; renderMasters();}));
  $('#m-q').addEventListener('input', e=>{MQ=e.target.value; MPAGE=1; renderMBody();});
  renderMBody();
}
function renderMBody(){
  const b = $('#m-body'); const q = MQ.toLowerCase();
  if (MTAB==='warehouses'){
    b.innerHTML = `<div class="card"><table><thead><tr><th>Code</th><th>Name (master)</th><th>Name in pivot</th><th>In line extract</th></tr></thead><tbody>
      ${DATA.warehouses.map(w=>{ const pivotName = {AHM:'AHDWHN',KOLWH:'KOLWH',GURWH:'GURWH',BLRWH:'BLRWH',MUMWH:'MUMWH',HYDWH:'HYDWH'}[w.name]||w.name;
        const inExtract = ORDERS.some(o=>o.wh.replace(' WH','').startsWith(w.name.slice(0,3)));
        return `<tr><td>${esc(w.code)}</td><td>${esc(w.name)}</td><td>${esc(pivotName)}</td><td>${inExtract?'<span class="tag green">Yes</span>':'<span class="tag gray">Pivot only</span>'}</td></tr>`;}).join('')}</tbody></table>
      <div class="sub" style="margin-top:8px">Note: the same warehouse appears as “WH_0007 / AHM / AHM WH / AHDWHN / WH/0007” across tabs — a canonical warehouse code on every tab would remove all mapping ambiguity.</div></div>`;
    return;
  }
  if (MTAB==='items'){
    let rows = Object.entries(DATA.items).map(([code,it])=>({code, ...it, cat2: DATA.itemCat[code]||'—'}));
    Object.keys(DATA.itemCat).filter(k=>!DATA.items[k]).forEach(k=>rows.push({code:k, name:'— (not in Carton & MRP master)', mrp:0, category:'—', carton:0, cat2:DATA.itemCat[k]}));
    if(q) rows = rows.filter(r=>r.code.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)||String(r.category).toLowerCase().includes(q));
    const flag = r => r.category!=='—' && r.cat2!=='—' && r.category.trim().toUpperCase()!==r.cat2.trim().toUpperCase();
    b.innerHTML = `<div class="card"><div class="sub" style="margin-bottom:8px">${rows.length} SKUs · amber = category disagrees between Carton/MRP master and Item Category master · “0” carton size blocks carton math</div>
      <div class="scrollx"><table><thead><tr><th>Code</th><th>Name</th><th class="num">MRP</th><th>Category (carton master)</th><th>Category (item master)</th><th class="num">Carton size</th></tr></thead><tbody>
      ${rows.slice(0,400).map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td class="num">${r.mrp?'₹'+r.mrp:'—'}</td>
        <td>${flag(r)?`<span class="tag amber">${esc(r.category)}</span>`:esc(r.category)}</td>
        <td>${flag(r)?`<span class="tag amber">${esc(r.cat2)}</span>`:esc(r.cat2)}</td>
        <td class="num">${r.carton||'<span class="tag red">0</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
    return;
  }
  // platforms
  let rows = DATA.platformMaster || [];
  if(q) rows = rows.filter(r=>r.some(c=>String(c).toLowerCase().includes(q)));
  const PER=25, pages=Math.max(1,Math.ceil(rows.length/PER)); MPAGE=Math.min(MPAGE,pages);
  const page = rows.slice((MPAGE-1)*PER, MPAGE*PER);
  b.innerHTML = `<div class="card"><div class="sub" style="margin-bottom:8px">${rows.length} customer locations</div>
    <div class="scrollx"><table><thead><tr><th>Name</th><th>City</th><th>Display name</th><th>Channel</th><th>City type</th></tr></thead>
    <tbody>${page.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="pager"><span>Page ${MPAGE}/${pages}</span><button id="mprev" ${MPAGE<=1?'disabled':''}>‹</button><button id="mnext" ${MPAGE>=pages?'disabled':''}>›</button></div></div>`;
  $('#mprev')?.addEventListener('click',()=>{MPAGE--;renderMBody();});
  $('#mnext')?.addEventListener('click',()=>{MPAGE++;renderMBody();});
}

/* ============ ABOUT / COVERAGE ============ */
function renderAbout(){
  $('#view-about').innerHTML = `
  <div class="card" style="margin-bottom:14px"><h3>What this dashboard reads</h3><div class="sub">Live from <b>${esc(DATA._source?.spreadsheet || "the Google Sheet")}</b> · read ${DATA.fetchedAt ? new Date(DATA.fetchedAt).toLocaleString("en-IN") : "—"}</div>
    <p style="font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 10px">
      <b>Rows read</b> is the row count returned by the tab, excluding its header. Compare it
      against the sheet directly: it should equal the last used row minus one. If it doesn't,
      the dashboard is not seeing what you think it is.</p>
    <table><thead><tr><th>Sheet tab</th><th>Feeds</th><th style="text-align:right">Rows read</th><th style="text-align:right">After processing</th></tr></thead><tbody>
      ${(() => {
        const src = DATA._source || {tabs:{}, rows_read:{}, unmatched:[]};
        const spec = [
          ['poLines',        'PO lines, ageing, KPIs, all charts, CSV export', `${fmtIN(ORDERS.length)} POs / ${fmtIN(DATA.poLines.length)} lines`],
          ['fillRate',       'Billing: PO → SO → Invoice → GRN',               `${fmtIN(DATA.fillRate.length)} lines`],
          ['items',          'MRP, carton size, category',                     `${fmtIN(Object.keys(DATA.items).length)} SKUs`],
          ['itemCat',        'Category cross-check',                           `${fmtIN(Object.keys(DATA.itemCat).length)} SKUs`],
          ['warehouses',     'Warehouse reference',                            `${fmtIN(DATA.warehouses.length)} WHs`],
          ['platformMaster', 'Channel / platform reference',                   `${fmtIN((DATA.platformMaster||[]).length)} rows`]
        ];
        return spec.map(([key, feeds, after]) => {
          const tab = src.tabs[key];
          const rows = src.rows_read[key];
          const isSkipped = (src.skipped || []).includes(key);
          const missing = !tab;
          return `<tr${missing?' style="opacity:.6"':''}>
            <td>${isSkipped ? '<span style="color:var(--warn)">switched off</span>'
                 : missing ? '<span style="color:var(--crit)">not matched</span>' : esc(tab)}</td>
            <td>${feeds}</td>
            <td style="text-align:right">${missing ? '—' : fmtIN(rows)}</td>
            <td style="text-align:right">${missing ? '—' : after}</td></tr>`;
        }).join('');
      })()}
    </tbody></table>
    ${(DATA._source?.skipped||[]).length ? `<div class="note" style="margin-top:10px">
      <b>Switched off:</b> ${DATA._source.skipped.join(', ')}. Too large to send to the browser as raw
      rows. These need summarising on the server before they can be switched back on. This is a
      deliberate setting in <code>api/po-data.js</code>, not a failure.</div>` : ''}
    ${(DATA._source?.unmatched||[]).length ? `<div class="note" style="margin-top:10px">
      <b>${DATA._source.unmatched.length} tab(s) not matched:</b> ${DATA._source.unmatched.join(', ')}.
      Those sections are empty because the tab name in <code>api/po-data.js</code> doesn't match the sheet —
      not because the data is missing.</div>` : ''}
    </div>
  <div class="card" style="margin-bottom:14px"><h3>How figures are derived</h3><div class="sub">Nothing on this dashboard is precomputed</div>
    <p style="line-height:1.6;font-size:12.5px">Every headline number, chart and table is calculated in the browser from the <b>${esc(DATA._source?.tabs?.poLines || "PO lines")}</b> tab at the moment the page loads. Earlier versions read summary figures from a separate pivot tab, which is why headline counts could disagree with the line-level tables. That is no longer possible — KPIs and tables now come from the same rows. PO counts are distinct PO numbers, not line counts. Ageing is measured from today (${TODAY_LABEL}), not a fixed snapshot date.</p></div>
  <div class="card"><h3>Data-quality findings in this snapshot</h3><div class="sub">Worth fixing at source — each one currently limits what the dashboard can compute</div>
    <div class="alerts">
      ${[`${DQ.mism} SKUs have conflicting categories between the Carton/MRP master and the Item Category master (e.g. “TOASTS” vs “TOAST”, “On the go cakes” vs “CAKES”).`,
         `${DQ.noCarton} SKUs have carton size 0/blank — carton counts can't be derived for them.`,
         `Duplicate item row: FG/0048 appears twice in the Carton & MRP master.`,
         `${DQ.noAppt} of ${DATA.poLines.length} raw PO lines have no appointment date.`,
         `${DQ.noCat} SKUs exist in the Item Category master but not in the Carton/MRP master (no MRP / carton data).`,
         `PO numbers in Dispatch vs Sales are stored as numbers and display in scientific notation (e.g. 2.73811E+12) — precision is lost; store as text.`,
         `Warehouse naming varies by tab (WH_0007 / WH/0007 / AHM / AHM WH / AHDWHN) — a canonical code would make joins reliable.`]
        .map(t=>`<div class="al"><div class="ic w">▲</div><div>${t}</div></div>`).join('')}
    </div></div>`;
}

/* ============ shell: routing, search, alerts, theme ============ */
const TITLES = {dashboard:['Pending PO Dashboard','Home / Dashboard'], pos:['Pending PO Management','Home / Pending POs'],
  podetail:['PO Details','Home / Pending POs / Details'], billing:['Billing Status — Dispatch vs Sales','Home / Billing'],
  report:['Report View — cross-tabs by platform','Home / Report view'],
  masters:['Master Data','Home / Masters'], about:['Data Coverage & Quality','Home / Data coverage']};
function goView(name){
  $$('.view').forEach(x=>x.classList.remove('active'));
  $('#view-'+name).classList.add('active');
  $$('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.view===name));
  const [t,c] = TITLES[name]; $('#viewtitle').textContent=t; $('#crumb').textContent=c;
  if(name==='podetail') renderPODetail();
  // Repaint on entry: the scope may have changed while another tab was open.
  else if(name==='dashboard') renderDashboard();
  else if(name==='pos') renderPOs();
  else if(name==='report') renderReport();
  $('#content').scrollTop = 0;
}
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if(g){ e.preventDefault(); goView(g.dataset.go); }
  if(!e.target.closest('.dropdown')) $$('.dd-menu').forEach(m=>m.style.display='none');
});
function toggleMenu(m){ const was = m.style.display==='block'; $$('.dd-menu').forEach(x=>x.style.display='none'); m.style.display = was?'none':'block'; }
$$('#nav a').forEach(a=>a.addEventListener('click', e=>{e.preventDefault(); goView(a.dataset.view);}));
$('#pill-pos').textContent = GT_N;
/* bell */
const _AL = buildAlerts();
$('#bellbadge').textContent = _AL.filter(a=>a.sev!=='i').length;
$('#bellmenu').innerHTML = _AL.map(a=>`<div class="al" style="padding:8px 6px;display:flex;gap:9px"><div class="ic ${a.sev}">${a.sev==='c'?'!':a.sev==='w'?'▲':'i'}</div><div style="font-size:12px">${esc(a.t)}<small style="display:block;color:var(--muted)">${esc(a.s)}</small></div></div>`).join('');
$('#bellbtn').addEventListener('click', e=>{e.stopPropagation(); toggleMenu($('#bellmenu'));});
/* theme */
$('#themebtn').addEventListener('click', ()=>{
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme==='dark' ? 'light' : 'dark';
});
/* global search */
const gs = $('#gsearch'), gr = $('#gresults');
document.addEventListener('keydown', e=>{ if(e.key==='/' && document.activeElement!==gs && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); gs.focus(); }});
gs.addEventListener('input', ()=>{
  const q = gs.value.trim().toLowerCase();
  if(q.length<2){ gr.style.display='none'; return; }
  const hits = [];
  ORDERS.forEach(o=>{ if(o.orderId.toLowerCase().includes(q)||o.channel.toLowerCase().includes(q)) hits.push({t:`${o.orderId} — ${o.platform}, ${fmtC(o.value)}`, s:'Pending PO', act:()=>openPO(o.orderId)}); });
  Object.entries(DATA.items).forEach(([c,it])=>{ if(c.toLowerCase().includes(q)||it.name.toLowerCase().includes(q)) hits.push({t:`${c} — ${it.name}`, s:'Item master', act:()=>{MTAB='items';MQ=c;goView('masters');renderMasters();}}); });
  PLATS.forEach(p=>{ if(p.toLowerCase().includes(q)) hits.push({t:p, s:`Platform — ${P.wh.counts['Grand Total'][p]||0} pending POs`, act:()=>{goView('pos'); FS.plat=p; renderPOs();}}); });
  gr.innerHTML = hits.slice(0,12).map((h,i)=>`<div class="hit" data-i="${i}">${esc(h.t)}<small style="color:var(--muted);display:block">${esc(h.s)}</small></div>`).join('') || '<div class="hit">No matches</div>';
  gr.style.display='block';
  $$('.hit', gr).forEach(el=>el.addEventListener('click', ()=>{ const h=hits[+el.dataset.i]; if(h){ h.act(); gr.style.display='none'; gs.value=''; }}));
});
document.addEventListener('click', e=>{ if(!e.target.closest('.gsearch')) gr.style.display='none'; });
function alertToast(msg){ showTipToast(msg); }
function showTipToast(msg){ const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface-1);padding:9px 16px;border-radius:9px;font-size:12.5px;z-index:200;box-shadow:var(--shadow)';
  t.textContent=msg; document.body.append(t); setTimeout(()=>t.remove(), 2600); }

/* ============ boot ============ */
renderDashboard(); renderPOs(); renderReport(); renderBilling(); renderMasters(); renderAbout(); renderPODetail();

</script>
</body>
</html>
